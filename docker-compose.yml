services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    env_file: [.env]
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS: fastembed
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on: [qdrant]
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  qdrant_data:
